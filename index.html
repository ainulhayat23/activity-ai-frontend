<script>
let riwayatPencarian = [];

const BACKEND_URL = "https://activity-ai-backend-grdo-git-main-ainulhayat23s-projects.vercel.app";

function render() {
  let text = "";

  riwayatPencarian.forEach((pencarian, i) => {
    text += (i + 1) + ". " + pencarian + "\n";
  });

  document.getElementById("totalPencarian").innerText =
    "Total riwayat: " + riwayatPencarian.length + " pencarian";

  document.getElementById("list").innerText =
    text || "Belum ada riwayat pencarian.";
}

function tambahRiwayat() {
  const query = document.getElementById("searchQuery").value.trim();

  if (!query) {
    alert("Masukkan judul atau genre film terlebih dahulu!");
    return;
  }

  riwayatPencarian.push(query);
  document.getElementById("searchQuery").value = "";
  render();
}

async function dapatkanRekomendasi() {
  if (riwayatPencarian.length === 0) {
    alert("Tambahkan riwayat pencarian terlebih dahulu!");
    return;
  }

  document.getElementById("result").innerText = "Menganalisis selera film Anda...";

  const daftarRiwayat = riwayatPencarian.map((p, i) => (i + 1) + ". " + p).join("\n");

  try {
    const res = await fetch(`${BACKEND_URL}/api/analyze`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        search_history: daftarRiwayat
      })
    });

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    const json = await res.json();

    document.getElementById("result").innerText =
      json.result || json.error || "Tidak ada rekomendasi yang ditemukan.";

  } catch (error) {
    console.error("Error analyze:", error);
    document.getElementById("result").innerText =
      "Gagal menghubungi server AI. Cek URL backend, status deploy, atau CORS.";
  }
}

async function generatePoster() {
  if (riwayatPencarian.length === 0) {
    document.getElementById("imageStatus").innerText =
      "Masukkan riwayat pencarian terlebih dahulu agar AI tahu selera Anda.";
    return;
  }

  document.getElementById("imageStatus").innerText =
    "Sedang membuat poster inspirasi...";
  document.getElementById("aiImage").style.display = "none";

  const daftarRiwayat = riwayatPencarian.join(", ");

  try {
    const res = await fetch(`${BACKEND_URL}/api/generate-images`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        themes: daftarRiwayat
      })
    });

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    const json = await res.json();

    if (json.image) {
      document.getElementById("aiImage").src = "data:image/png;base64," + json.image;
      document.getElementById("aiImage").style.display = "block";
      document.getElementById("imageStatus").innerText =
        "Poster berhasil dibuat berdasarkan selera Anda!";
    } else {
      document.getElementById("imageStatus").innerText =
        json.error || "Gagal membuat poster.";
    }

  } catch (error) {
    console.error("Error generate image:", error);
    document.getElementById("imageStatus").innerText =
      "Gagal menghubungi server pembuat gambar. Cek endpoint backend atau CORS.";
  }
}

render();
</script>
